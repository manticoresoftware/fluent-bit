service:
  flush: 0.2
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}
  parsers_file: ${MANTICORE_PARSERS_FILE}

pipeline:
  inputs:
    - name: tail
      tag: manticore_wire
      path: ${MANTICORE_INPUT_PATH}
      read_from_head: true
      parser: manticore_json

  outputs:
    - name: manticore
      match: '*'
      host: 127.0.0.1
      port: ${MANTICORE_PORT}
      table: wire logs
      stream_chunk_size: 128
