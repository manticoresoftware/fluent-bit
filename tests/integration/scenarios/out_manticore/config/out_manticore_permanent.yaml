service:
  flush: 0.2
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: dummy
      tag: manticore_permanent
      dummy: '{"id":44,"message":"permanent-item"}'
      samples: 1

  outputs:
    - name: manticore
      match: '*'
      host: 127.0.0.1
      port: ${MANTICORE_PORT}
      table: wire_logs
